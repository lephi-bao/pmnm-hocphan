{% macro render_empty_state(icon, title, message, btn_url, btn_text,
btn_class="btn-primary") %}
<div class="text-center py-5 my-3">
  <div
    class="bg-light rounded-circle d-inline-flex align-items-center justify-content-center mb-3"
    style="width: 80px; height: 80px"
  >
    <i class="bi {{ icon }} text-secondary" style="font-size: 2.2rem"></i>
  </div>
  <h5 class="fw-bold text-dark">{{ title }}</h5>
  <p class="text-muted mb-4">{{ message }}</p>
  <a
    href="{{ btn_url }}"
    class="btn {{ btn_class }} rounded-pill px-4 shadow-sm"
  >
    <i class="bi bi-plus-circle me-1"></i> {{ btn_text }}
  </a>
</div>
{% endmacro %}
