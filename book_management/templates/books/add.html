{% extends "base.html" %} {% block content %}
<div class="row justify-content-center">
  <div class="col-lg-8">
    <div class="mb-3">
      <a
        href="/books"
        class="text-decoration-none text-muted small fw-semibold"
      >
        <i class="bi bi-arrow-left me-1"></i> Quay lại danh sách kho sách
      </a>
    </div>
    <div class="card border-0 shadow-sm rounded-4 overflow-hidden">
      <div class="card-header bg-success text-white py-3 px-4 border-0">
        <h5 class="mb-0 fw-bold">
          <i class="bi bi-journal-plus me-2"></i>Thêm Sách Mới Vào Kho
        </h5>
      </div>
      <div class="card-body p-4">
        <form method="POST" class="row g-3">
          <div class="col-md-6">
            <label class="form-label fw-semibold"
              >Tựa sách <span class="text-danger">*</span></label
            >
            <input
              type="text"
              name="title"
              class="form-control rounded-3"
              placeholder="Nhập tên cuốn sách..."
              required
              autofocus
            />
          </div>
          <div class="col-md-6">
            <label class="form-label fw-semibold"
              >Tác giả <span class="text-danger">*</span></label
            >
            <input
              type="text"
              name="author"
              class="form-control rounded-3"
              placeholder="Nhập tên tác giả..."
              required
            />
          </div>
          <div class="col-md-6">
            <label class="form-label fw-semibold"
              >Danh mục <span class="text-danger">*</span></label
            >
            <select name="category_id" class="form-select rounded-3" required>
              <option value="">-- Chọn danh mục phân loại --</option>
              {% for cat in categories %}
              <option value="{{ cat.id }}">{{ cat.name }}</option>
              {% endfor %}
            </select>
            {% if not categories %}
            <div class="form-text text-danger">
              Chưa có danh mục nào.
              <a href="/categories/add">Tạo danh mục tại đây</a> trước khi thêm
              sách.
            </div>
            {% endif %}
          </div>
          <div class="col-md-6">
            <label class="form-label fw-semibold">Năm xuất bản</label>
            <input
              type="number"
              name="publish_year"
              class="form-control rounded-3"
              placeholder="Ví dụ: 2024"
              min="1000"
              max="2100"
            />
          </div>
          <div class="col-md-6">
            <label class="form-label fw-semibold"
              >Giá bán (VNĐ) <span class="text-danger">*</span></label
            >
            <div class="input-group">
              <input
                type="number"
                step="100"
                min="0"
                name="price"
                class="form-control rounded-start-3"
                placeholder="150000"
                required
              />
              <span class="input-group-text rounded-end-3">₫</span>
            </div>
          </div>
          <div class="col-md-6">
            <label class="form-label fw-semibold"
              >Số lượng tồn kho <span class="text-danger">*</span></label
            >
            <input
              type="number"
              name="quantity"
              class="form-control rounded-3"
              value="1"
              min="0"
              required
            />
          </div>
          <div class="col-12">
            <label class="form-label fw-semibold">Mô tả nội dung sách</label>
            <textarea
              name="description"
              class="form-control rounded-3"
              rows="3"
              placeholder="Tóm tắt nội dung hoặc ghi chú thêm về sách..."
            ></textarea>
          </div>
          <div
            class="col-12 d-flex justify-content-end gap-2 pt-3 mt-2 border-top"
          >
            <a href="/books" class="btn btn-light rounded-pill px-4">Hủy bỏ</a>
            <button
              type="submit"
              class="btn btn-success rounded-pill px-4 fw-semibold shadow-sm"
            >
              <i class="bi bi-check-lg me-1"></i> Lưu Sách Mới
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
