{% extends "base.html" %} {% block content %}
<div class="row justify-content-center">
  <div class="col-lg-8">
    <div class="mb-3">
      <a
        href="/books"
        class="text-decoration-none text-muted small fw-semibold"
      >
        <i class="bi bi-arrow-left me-1"></i> Quay lại danh sách kho sách
      </a>
    </div>
    <div class="card border-0 shadow-sm rounded-4 overflow-hidden">
      <div class="card-header bg-warning text-dark py-3 px-4 border-0">
        <h5 class="mb-0 fw-bold">
          <i class="bi bi-pencil-square me-2"></i>Cập Nhật Sách #{{ book.id }}
        </h5>
      </div>
      <div class="card-body p-4">
        <form method="POST" class="row g-3">
          <div class="col-md-6">
            <label class="form-label fw-semibold"
              >Tựa sách <span class="text-danger">*</span></label
            >
            <input
              type="text"
              name="title"
              class="form-control rounded-3"
              value="{{ book.title }}"
              required
            />
          </div>
          <div class="col-md-6">
            <label class="form-label fw-semibold"
              >Tác giả <span class="text-danger">*</span></label
            >
            <input
              type="text"
              name="author"
              class="form-control rounded-3"
              value="{{ book.author }}"
              required
            />
          </div>
          <div class="col-md-6">
            <label class="form-label fw-semibold"
              >Danh mục <span class="text-danger">*</span></label
            >
            <select name="category_id" class="form-select rounded-3" required>
              {% for cat in categories %}
              <option
                value="{{ cat.id }}"
                {%
                if
                cat.id=""
                ="book.category_id"
                %}selected{%
                endif
                %}
              >
                {{ cat.name }}
              </option>
              {% endfor %}
            </select>
          </div>
          <div class="col-md-6">
            <label class="form-label fw-semibold">Năm xuất bản</label>
            <input
              type="number"
              name="publish_year"
              class="form-control rounded-3"
              value="{{ book.publish_year or '' }}"
              min="1000"
              max="2100"
            />
          </div>
          <div class="col-md-6">
            <label class="form-label fw-semibold"
              >Giá bán (VNĐ) <span class="text-danger">*</span></label
            >
            <div class="input-group">
              <input
                type="number"
                step="100"
                min="0"
                name="price"
                class="form-control rounded-start-3"
                value="{{ book.price }}"
                required
              />
              <span class="input-group-text rounded-end-3">₫</span>
            </div>
          </div>
          <div class="col-md-6">
            <label class="form-label fw-semibold"
              >Số lượng tồn kho <span class="text-danger">*</span></label
            >
            <input
              type="number"
              name="quantity"
              class="form-control rounded-3"
              value="{{ book.quantity }}"
              min="0"
              required
            />
          </div>
          <div class="col-12">
            <label class="form-label fw-semibold">Mô tả nội dung sách</label>
            <textarea
              name="description"
              class="form-control rounded-3"
              rows="3"
            >
{{ book.description or '' }}</textarea
            >
          </div>
          <div
            class="col-12 d-flex justify-content-end gap-2 pt-3 mt-2 border-top"
          >
            <a href="/books" class="btn btn-light rounded-pill px-4">Hủy bỏ</a>
            <button
              type="submit"
              class="btn btn-warning text-dark rounded-pill px-4 fw-semibold shadow-sm"
            >
              <i class="bi bi-save me-1"></i> Cập Nhật Thông Tin
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
