{% extends "base.html" %} {% block content %}
<div class="row justify-content-center">
  <div class="col-md-7 col-lg-6">
    <div class="mb-3">
      <a
        href="/categories"
        class="text-decoration-none text-muted small fw-semibold"
      >
        <i class="bi bi-arrow-left me-1"></i> Quay lại danh sách danh mục
      </a>
    </div>
    <div class="card border-0 shadow-sm rounded-4 overflow-hidden">
      <div class="card-header bg-warning text-dark py-3 px-4 border-0">
        <h5 class="mb-0 fw-bold">
          <i class="bi bi-pencil-square me-2"></i>Cập Nhật Danh Mục #{{
          category.id }}
        </h5>
      </div>
      <div class="card-body p-4">
        <form method="POST">
          <div class="mb-3">
            <label class="form-label fw-semibold"
              >Tên danh mục <span class="text-danger">*</span></label
            >
            <input
              type="text"
              name="name"
              class="form-control form-control-lg rounded-3"
              value="{{ category.name }}"
              required
            />
          </div>
          <div class="mb-4">
            <label class="form-label fw-semibold">Mô tả chi tiết</label>
            <textarea
              name="description"
              class="form-control rounded-3"
              rows="4"
            >
{{ category.description or '' }}</textarea
            >
          </div>
          <div class="d-flex justify-content-end gap-2 pt-2 border-top">
            <a href="/categories" class="btn btn-light rounded-pill px-4"
              >Hủy bỏ</a
            >
            <button
              type="submit"
              class="btn btn-warning text-dark rounded-pill px-4 fw-semibold shadow-sm"
            >
              <i class="bi bi-save me-1"></i> Lưu Thay Đổi
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
