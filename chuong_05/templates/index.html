{% extends "base.html" %}

{% block title %}Trang chủ{% endblock %}

{% block content %}
<div class="container py-4" style="max-width: 800px;">
    <h2 class="text-center fw-bold text-primary mb-4">BÀI TẬP CHƯƠNG 5</h2>

    <div class="row row-cols-1 row-cols-md-3 g-4">
        <!-- Bài 1 -->
        <div class="col">
            <div class="card h-100 shadow-sm border-0 text-center">
                <div class="card-body d-flex flex-column p-4">
                    <div class="fs-1 text-primary mb-2"><i class="bi bi-calculator"></i></div>
                    <h5 class="card-title fw-bold">Bài 1</h5>
                    <p class="card-text text-muted flex-grow-1">Máy tính cơ bản</p>
                    <a href="/bai-01" class="btn btn-primary fw-bold mt-3">Thực hiện</a>
                </div>
            </div>
        </div>

        <!-- Bài 2 -->
        <div class="col">
            <div class="card h-100 shadow-sm border-0 text-center">
                <div class="card-body d-flex flex-column p-4">
                    <div class="fs-1 text-success mb-2"><i class="bi bi-mortarboard"></i></div>
                    <h5 class="card-title fw-bold">Bài 2</h5>
                    <p class="card-text text-muted flex-grow-1">Tính điểm học phần</p>
                    <a href="/bai-02" class="btn btn-success fw-bold mt-3">Thực hiện</a>
                </div>
            </div>
        </div>

        <!-- Bài 3 -->
        <div class="col">
            <div class="card h-100 shadow-sm border-0 text-center">
                <div class="card-body d-flex flex-column p-4">
                    <div class="fs-1 text-warning mb-2"><i class="bi bi-heart-pulse"></i></div>
                    <h5 class="card-title fw-bold">Bài 3</h5>
                    <p class="card-text text-muted flex-grow-1">Tính chỉ số BMI</p>
                    <a href="/bai-03" class="btn btn-warning text-white fw-bold mt-3">Thực hiện</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
