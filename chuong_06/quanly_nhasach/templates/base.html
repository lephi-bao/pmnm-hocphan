<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}Nhà sách Sông Hương{% endblock %}</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />
    <style>
      body {
        background-color: #f8fafc;
      }
      .navbar-songhuong {
        background-color: #163a70;
      }
      .badge-cart {
        background-color: #f97316;
        color: #fff;
        font-size: 0.75rem;
      }
      .price-text {
        color: #ea580c;
        font-weight: 700;
      }
      .book-cover-placeholder {
        background-color: #e2e8f0;
        color: #64748b;
        display: flex;
        align-items: center;
        justify-content: center;
      }
    </style>
  </head>
  <body>
    <nav
      class="navbar navbar-expand-lg navbar-dark navbar-songhuong sticky-top shadow-sm"
    >
      <div class="container">
        <a
          class="navbar-brand fw-bold d-flex align-items-center gap-2"
          href="{{ url_for('books') }}"
        >
          <i class="bi bi-book-half"></i>
          <span>Nhà sách Sông Hương</span>
        </a>
        <div class="d-flex align-items-center gap-4 ms-auto">
          <a class="nav-link text-white fw-medium" href="{{ url_for('books') }}"
            >Sách</a
          >
          <a
            class="nav-link text-white fw-medium d-flex align-items-center gap-1"
            href="{{ url_for('cart') }}"
          >
            <i class="bi bi-cart3"></i>
            <span>Giỏ hàng</span>
            <span class="badge rounded-pill badge-cart ms-1"
              >{{ cart_count }}</span
            >
          </a>
        </div>
      </div>
    </nav>

    <main class="container my-4">
      {% with messages = get_flashed_messages(with_categories=true) %} {% if
      messages %} {% for category, message in messages %}
      <div
        class="alert alert-{{ category }} alert-dismissible fade show"
        role="alert"
      >
        {{ message }}
        <button
          type="button"
          class="btn-close"
          data-bs-dismiss="alert"
        ></button>
      </div>
      {% endfor %} {% endif %} {% endwith %} {% block content %}{% endblock %}
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    {% block scripts %}{% endblock %}
  </body>
</html>
